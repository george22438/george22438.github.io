<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — The Garcia Report</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png?v=3" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Garcia Report" />
  <meta name="application-name" content="Garcia Report" />
  <style>
    .offline { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1rem; padding: 2rem 1.25rem; }
    .offline img { width: 96px; height: 96px; }
    .offline h1 { font-family: "Bebas Neue", Impact, sans-serif; font-size: 2.6rem; letter-spacing: 0.04em; line-height: 1; }
    .offline h1 em { font-style: normal; color: var(--red); }
    .offline p { color: var(--muted); max-width: 32rem; }
  </style>
</head>
<body>
  <main class="wrap offline">
    <img src="/assets/logo.png" alt="" width="96" height="96" />
    <h1>You're <em>Offline</em></h1>
    <p>No signal in this corner. Check your connection and try again — pages you've already read are still available.</p>
    <a class="cta" href="/" onclick="location.reload(); return false;">Try Again</a>
  </main>
</body>
</html>
